name: Fix commercial model copy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-copy-once.yml"

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch demo.html
        run: |
          set -euo pipefail
          python3 -c "
          from pathlib import Path
          p = Path('demo.html')
          t = p.read_text(encoding='utf-8')
          reps = [
          ('Vendor settlement fee', 'Donate to VeriChar'),
          ('A 1% fee on the vendor payout is planned, treated as a standard business-to-business acquisition cost for vendors winning high-volume, automated orders. How it is collected at escrow release is still an open design question.', 'People can support the platform by donating to VeriChar itself and track almost every dollar. Free for donors, charities, and vendors with no settlement fees on giving flows.'),
          ('CSR dashboard licensing', 'Enterprise SaaS'),
          ('Large corporate brands can subscribe to an enterprise tier to access automated, audit-ready Corporate Social Responsibility (CSR) data logs generated safely by our off-chain encryption layers.', 'Large corporate brands can subscribe to an enterprise tier for automated, audit-ready CSR and impact reporting.'),
          ('Donors: 0%', 'Donors: free'),
          ('Charities: 0%', 'Charities: free'),
          ('Vendors: 1% planned fee', 'Vendors: free'),
          ('Brands: enterprise CSR tier', 'Brands: enterprise SaaS'),
          ('The planned vendor fee is not implemented or collected.', 'No vendor fee. Free for donors, charities, and vendors.'),
          ]
          for old, new in reps:
              if old not in t:
                  raise SystemExit('Missing: ' + old[:60])
              t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          print('ok')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo.html
          if git diff --staged --quiet; then
            echo "no demo changes"
          else
            git commit -m "demo.html: free for donors, charities, and vendors; no 1% fee"
            git push
          fi
          rm -f .github/workflows/fix-copy-once.yml
          git add -A .github/workflows/fix-copy-once.yml
          if ! git diff --staged --quiet; then
            git commit -m "Remove one-shot fix-copy workflow"
            git push
          fi
