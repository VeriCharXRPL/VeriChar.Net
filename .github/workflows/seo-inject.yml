name: Inject SEO

on:
  push:
    paths:
      - ".github/workflows/seo-inject.yml"
      - "scripts/inject_seo.py"
      - "assets/seo-head.snippet.html"
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inject_seo.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Inject SEO and schema.org identity into index.html" || true
          rm -f .github/workflows/seo-inject.yml .github/workflows/seo-meta.yml
          git add -A .github/workflows/
          git commit -m "Remove one-shot SEO inject workflows" || true
          git push
