name: Patch tax workflows
on:
  push:
    paths:
      - ".github/workflows/patch-tax.yml"
      - "scripts/patch_tax_workflows.py"
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_tax_workflows.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md verichar-whitepaper-v0.7.md assets/seo-head.snippet.html
          git commit -m "Enterprise tier: tax compliance workflows (support, not filing)" || true
          rm -f .github/workflows/patch-tax.yml
          git add -A .github/workflows/patch-tax.yml
          git commit -m "Remove patch-tax workflow" || true
          git push
