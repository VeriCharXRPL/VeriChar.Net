name: Patch tax filing integration
on:
  push:
    paths:
      - ".github/workflows/patch-tax-filing.yml"
      - "scripts/patch_tax_filing.py"
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_tax_filing.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md verichar-whitepaper-v0.7.md assets/seo-head.snippet.html || true
          git commit -m "Enterprise SaaS: planned tax filing integration (exports into filing tools, not filing for you)" || true
          rm -f .github/workflows/patch-tax-filing.yml
          git add -A .github/workflows/patch-tax-filing.yml
          git commit -m "Remove patch-tax-filing workflow" || true
          git push
