name: Inject SEO into index

on:
  push:
    paths:
      - ".github/workflows/seo-meta.yml"
      - "assets/seo-head.snippet.html"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject snippet after author meta
        run: |
          python3 -c "
from pathlib import Path
idx = Path('index.html')
t = idx.read_text(encoding='utf-8')
seo = Path('assets/seo-head.snippet.html').read_text(encoding='utf-8').strip()
if 'application/ld+json' not in t:
    needle = '<meta name=\"author\" content=\"Brianne Salato\">'
    assert needle in t
    t = t.replace(needle, needle + chr(10) + seo, 1)
old = '<p class=\"by\">Brianne Salato, Founder and Product Architect</p><p><a href=\"https://x.com/VeriCharOnChain\">@VeriCharOnChain on X</a><br><a href=\"mailto:VeriChar@proton.me\">VeriChar@proton.me</a></p>'
new = '<p class=\"by\">Brianne Salato, Founder and Product Architect</p><p><a href=\"https://verichar.net/\">verichar.net</a><br><a href=\"https://x.com/VeriCharOnChain\">@VeriCharOnChain on X</a><br><a href=\"mailto:VeriChar@proton.me\">VeriChar@proton.me</a></p>'
if old in t:
    t = t.replace(old, new, 1)
idx.write_text(t, encoding='utf-8')
print('ok')
"
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Inject SEO and schema.org identity into index.html" || true
          rm -f .github/workflows/seo-meta.yml
          git add -A .github/workflows/seo-meta.yml
          git commit -m "Remove one-shot seo inject workflow" || true
          git push
