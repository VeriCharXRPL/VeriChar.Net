name: Rebuild whitepaper PDF

on:
  push:
    paths:
      - ".github/workflows/rebuild-whitepaper-pdf.yml"
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build PDF with md-to-pdf
        run: |
          npx --yes md-to-pdf verichar-whitepaper-v0.7.md \
            --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' \
            --pdf-options '{"format":"Letter","margin":{"top":"20mm","bottom":"20mm","left":"18mm","right":"18mm"},"printBackground":true}'
          test -s verichar-whitepaper-v0.7.pdf
          ls -la verichar-whitepaper-v0.7.pdf

      - name: Commit PDF and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verichar-whitepaper-v0.7.pdf
          git commit -m "Rebuild verichar-whitepaper-v0.7.pdf from current Markdown (Testnet CI status)" || echo "No PDF change"
          rm -f .github/workflows/rebuild-whitepaper-pdf.yml
          git add -A .github/workflows/rebuild-whitepaper-pdf.yml
          git commit -m "Remove one-shot rebuild-whitepaper-pdf workflow" || true
          git push
