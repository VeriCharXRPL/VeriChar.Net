name: Rebuild whitepaper PDF

on:
  push:
    paths:
      - ".github/workflows/rebuild-whitepaper-pdf.yml"
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and TeX
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-plain-generic \
            lmodern

      - name: Build PDF from Markdown
        run: |
          pandoc verichar-whitepaper-v0.7.md \
            -o verichar-whitepaper-v0.7.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V documentclass=article \
            -V fontsize=11pt \
            -f gfm
          test -s verichar-whitepaper-v0.7.pdf
          ls -la verichar-whitepaper-v0.7.pdf

      - name: Commit PDF and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verichar-whitepaper-v0.7.pdf
          git commit -m "Rebuild verichar-whitepaper-v0.7.pdf from current Markdown (Testnet CI status)" || echo "No PDF change"
          rm -f .github/workflows/rebuild-whitepaper-pdf.yml
          git add -A .github/workflows/rebuild-whitepaper-pdf.yml
          git commit -m "Remove one-shot rebuild-whitepaper-pdf workflow" || true
          git push
