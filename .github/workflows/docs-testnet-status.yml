name: Docs Testnet status

on:
  push:
    paths:
      - ".github/workflows/docs-testnet-status.yml"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index and whitepaper
        run: |
          python3 << 'PY'
          from pathlib import Path

          idx = Path('index.html')
          t = idx.read_text(encoding='utf-8')
          old = 'VeriChar is a working prototype. It does not process real donations yet. Next comes the XRP Ledger test network with no real funds, then a small pilot after legal and security review.'
          new = 'VeriChar is a working prototype. It does not process real donations or Mainnet funds. Backend automated tests have passed on the <b>XRP Ledger Testnet</b> (conditional escrow create, finish, and cancel; reserve reads), via continuous integration. The public site and donation demo remain simulations. A small pilot would follow legal and security review.'
          if old not in t:
              raise SystemExit('index transparency paragraph not found')
          t = t.replace(old, new, 1)
          t = t.replace('href="verichar-whitepaper-v0.7.md"', 'href="verichar-whitepaper-v0.7.pdf"')
          idx.write_text(t, encoding='utf-8')
          print('index.html updated')

          wp = Path('verichar-whitepaper-v0.7.md')
          w = wp.read_text(encoding='utf-8')

          w = w.replace(
              'A **Testnet-only API foundation** exists. It does not submit transactions and does not touch Mainnet.\n\nThe flow described in later sections is the **intended design**. It will be tested on the XRP Ledger test network and reviewed by legal and security professionals before any real funds are handled.',
              'A **Testnet-only API foundation** exists. The public HTTP API does not submit ledger transactions and does not touch Mainnet.\n\n**XRPL Testnet verification (automated).** Backend continuous integration on GitHub Actions runs the full Node test suite against the live **XRP Ledger Testnet**, including faucet-funded wallets, conditional EscrowCreate / EscrowFinish / EscrowCancel (PREIMAGE-SHA-256), fee checks against XRPL.org, vendor balance-change confirmation, and reserve reads. As of **22 October 2026**, those runs complete successfully (for example **37 tests, 0 failures**). Public logs are available under the repository Actions tab. This is **not** Mainnet certification and **not** a claim that the public product processes donations.\n\nThe flow described in later sections is the **intended design**. Legal and security review are still required before any real (Mainnet) funds are handled.',
          )

          w = w.replace(
              '| **Testnet API** | Public `/healthz`; authenticated tenant context; validated Testnet account lookup. Bearer tokens stored only as SHA-256 hashes, bound to one tenant and explicit scopes. Browser is not given a token | Saved tenant data; transaction submission; escrow; oracle; OAuth; Mainnet |',
              '| **Testnet API** | Public `/healthz`; authenticated tenant context; validated Testnet account lookup. Bearer tokens stored only as SHA-256 hashes, bound to one tenant and explicit scopes. Browser is not given a token | Saved tenant data; product transaction submission; oracle productization; OAuth; Mainnet |\n| **Testnet integration tests (CI)** | Live Testnet: conditional XRP escrow create / finish / cancel; finish fee formula; vendor balance delta; network and account reserves. Runs on every push to `main` | Product UI settlement; RLUSD escrow confirmation; real OCR / delivery oracle |',
          )

          w = w.replace(
              '| Escrow service | Conditional XRPL escrow create / finish / cancel | Testnet helpers in repo; not productized |',
              '| Escrow service | Conditional XRPL escrow create / finish / cancel | **Testnet CI passed** for helper module; not productized on the public site |',
          )

          w = w.replace(
              '| **Now** | Honest prototype: simulation, Testnet API foundation, documentation aligned with free-for-all model |\n| **Next** | Testnet end-to-end escrow experiments; measure fees/reserves; RLUSD escrow feasibility; oracle spike with real sample documents |',
              '| **Now** | Honest prototype: simulation; Testnet API foundation; **automated XRPL Testnet escrow tests passing in CI**; free-for-all model in docs |\n| **Next** | Expand Testnet coverage (fee/reserve measurement at gift sizes); RLUSD escrow feasibility; oracle spike with real sample documents |',
          )

          if 'Testnet CI passed' not in w and 'automated XRPL Testnet' not in w:
              raise SystemExit('whitepaper patches may have failed')
          wp.write_text(w, encoding='utf-8')
          print('whitepaper updated')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html verichar-whitepaper-v0.7.md
          git commit -m "Docs: XRPL Testnet CI pass noted on site and whitepaper v0.7" || true
          rm -f .github/workflows/docs-testnet-status.yml
          git add -A .github/workflows/docs-testnet-status.yml
          git commit -m "Remove one-shot docs-testnet-status workflow" || true
          git push
