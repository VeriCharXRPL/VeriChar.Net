name: Audit package

# One-shot: tests + debloat + zip packages
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and test backend (includes XRPL Testnet)
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Debloat demo.html icons
        run: python3 scripts/debloat_demo.py

      - name: Patch reserves api_version
        run: python3 scripts/patch_reserves.py

      - name: Re-test after patches
        working-directory: backend
        run: npm test

      - name: Zip FRONT-END and BACKEND
        run: |
          mkdir -p packages dist
          zip -r packages/FRONT-END.zip index.html demo.html assets verichar-whitepaper-v0.7.pdf verichar-whitepaper-v0.7.md README.md
          zip -r packages/BACKEND.zip backend/package.json backend/package-lock.json backend/.env.example backend/.gitignore backend/src backend/tests API-DESIGN.md README.md .github/workflows/backend-tests.yml
          cp packages/FRONT-END.zip dist/FRONT-END.zip
          cp packages/BACKEND.zip dist/BACKEND.zip
          ls -la packages/

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo.html backend/src/reserves.js dist/FRONT-END.zip dist/BACKEND.zip
          git commit -m "Audit: debloat demo, reserves api_version 2, FRONT-END + BACKEND zips" || echo no-change
          rm -f .github/workflows/audit-package.yml
          git add -A .github/workflows/audit-package.yml
          git commit -m "Remove one-shot audit-package workflow" || echo no-wf
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: verichar-packages
          path: packages/*.zip
