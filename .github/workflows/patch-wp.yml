name: Patch WP message
on:
  push:
    paths:
      - ".github/workflows/patch-wp.yml"
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_wp_message.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verichar-whitepaper-v0.7.md
          git commit -m "Whitepaper: verifiable giving message framing" || true
          rm -f .github/workflows/patch-wp.yml
          git add -A .github/workflows/patch-wp.yml
          git commit -m "Remove patch-wp workflow" || true
          git push
